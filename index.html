<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16834a">
<title>尾羽急電鉄 ルーレット3</title>
<style>
:root{--green:#16834a;--dark:#0d6236;--soft:#effaf3;--ink:#292929;--muted:#777;--line:#dcebe1;--pale:#f8fcf9}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:650px;margin:auto;padding:35px 16px 50px}
.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--green);text-align:center}
h1{text-align:center;font-size:clamp(26px,6vw,36px);margin:10px 0}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:0 0 26px}
.panel{border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 28px #00000009}
.lead{background:var(--soft);border:1px solid #cce8d5;border-radius:14px;text-align:center;padding:19px 12px;margin-bottom:17px}
.small{font-size:12px;color:var(--muted);font-weight:650}
.lead-title{font-size:24px;font-weight:900;color:var(--dark);margin-top:5px}
.stops{display:grid;gap:10px}
.stop{display:flex;align-items:center;gap:14px;min-height:68px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 15px}
.stop.active{border-color:#8dc9a2;background:var(--pale)}
.stop-number{flex:0 0 82px;color:var(--green);font-size:12px;font-weight:850;letter-spacing:.04em}.stop-terminal{display:block;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:0;margin-top:3px}
.stop-name{font-size:18px;line-height:1.4;font-weight:800;overflow-wrap:anywhere}
.placeholder{color:#b6b6b6;font-weight:600}
.actions{display:grid;gap:10px;margin-top:20px}
button{border:0;border-radius:12px;padding:15px 20px;font-size:15px;font-weight:800;cursor:pointer}
#draw{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--dark)}
#draw:hover{background:#11723f}
#copy{background:#fff;color:var(--dark);border:1px solid #b9dcc5}
button:active:not(:disabled){transform:translateY(2px)}
button:disabled{opacity:.55;cursor:not-allowed}
.status{min-height:20px;margin-top:13px;color:var(--dark);text-align:center;font-size:13px;font-weight:650}
.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin-top:16px}
footer{text-align:center;color:#aaa;font-size:10px;letter-spacing:.09em;margin-top:26px}
@media(min-width:560px){.actions{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="eyebrow">OBAKYU RAILWAY · STATION ROULETTE</div>
<h1>尾羽急電鉄 ルーレット3</h1>
<p class="subtitle">停車駅数を決めて、その数だけ停車駅を抽選します</p>
<section class="panel" aria-live="polite">
<div class="lead"><div class="small">停車駅数</div><div id="count" class="lead-title placeholder">—駅</div></div>
<div id="stops" class="stops" aria-label="抽選された停車駅"></div>
<div class="actions"><button id="draw" type="button">ルーレットを回す</button><button id="copy" type="button" disabled>結果をコピー</button></div>
<div class="status" id="status" role="status"></div>
<p class="note">停車駅数は4〜7駅から抽選し、7駅は低確率で当選します。<br>1駅目は尾羽原に固定し、2駅目以降は各駅2秒の抽選演出を行います。</p>
</section>
<footer>OBAKYU RAILWAY · STATION ROULETTE</footer>
</main>
<script>
"use strict";
const destinations=["尾羽原","井口","梅郷","雲中","安越","十川真砂橋","千峰","南雲谷","雲谷","長峰","西高徳","高徳","明神前","舞子台","紀田","穂","瀬舞","余美","千鳥","問屋町","問屋蔵前","赤堀大沢","赤堀","新赤堀","塚野","金田","百鳥","西百鳥","支線尾羽","北尾羽","新高徳","高徳整備場北","高徳空港","鵲橋","金田市","金田空港","金田新都心","新箱倉金田","南箱倉","上井口","参田町","東本郷","本郷","西問屋町","本郷神宮前","千鳥山道","奥千鳥","南千鳥","水橋","飛岡","垂岡","飛水竜田","南竜田","大原","新塚","飛水柏原","上金田","赤堀アリーナ","科学研究所跡"];
const countEl=document.getElementById("count"),stops=document.getElementById("stops"),status=document.getElementById("status"),draw=document.getElementById("draw"),copy=document.getElementById("copy");
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeStopCard(index,total){const card=document.createElement("div");card.className="stop active";const number=document.createElement("div");number.className="stop-number";number.textContent=`${index+1}駅目`;if(index===0||index===total-1){const terminal=document.createElement("small");terminal.className="stop-terminal";terminal.textContent=index===0?"（始発駅）":"（終着駅）";number.append(terminal)}const name=document.createElement("div");name.className="stop-name";name.textContent="抽選中…";card.append(number,name);return {card,name}}
let finalStops=[];
draw.addEventListener("click",async()=>{
 draw.disabled=true;copy.disabled=true;copy.textContent="結果をコピー";finalStops=[];stops.replaceChildren();countEl.classList.remove("placeholder");
 status.textContent="停車駅数を抽選中…";
 const countStarted=performance.now();
 const countOptions=[4,4,5,5,6,6,7];
 while(performance.now()-countStarted<1000){countEl.textContent=`${pick(countOptions)}駅`;await wait(70)}
 const total=pick(countOptions);countEl.textContent=`${total}駅`;
 const remaining=shuffle(destinations.filter(station=>station!=="尾羽原")).slice(0,total-1);
 const chosen=["尾羽原",...remaining];
 for(let i=0;i<total;i++){
  status.textContent=i===0?"1駅目は尾羽原に固定されています。":`${i+1}駅目を抽選中…`;
  const {card,name}=makeStopCard(i,total);stops.append(card);
  if(i===0){name.textContent="尾羽原";card.classList.remove("active");finalStops.push("尾羽原");continue;}
  const started=performance.now();
  while(performance.now()-started<2000){name.textContent=pick(destinations.filter(station=>station!=="尾羽原"));await wait(65)}
  name.textContent=chosen[i];card.classList.remove("active");finalStops.push(chosen[i]);
 }
 status.textContent="抽選完了。よい旅を！";draw.disabled=false;copy.disabled=false;draw.textContent="もう一度回す";
});
copy.addEventListener("click",async()=>{
 if(finalStops.length<2)return;
 const text=`【尾羽急電鉄 ルーレット3】\n停車駅数：${finalStops.length}駅\n${finalStops.map((station,i)=>`${i+1}駅目：${station}`).join("\n")}`;
 try{await navigator.clipboard.writeText(text);status.textContent="結果をコピーしました！"}
 catch(e){const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.append(area);area.select();const ok=document.execCommand("copy");area.remove();status.textContent=ok?"結果をコピーしました！":"コピーできませんでした。"}
});
</script>
</body>
</html>
